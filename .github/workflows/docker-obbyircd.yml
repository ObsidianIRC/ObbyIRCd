name: Build and Push obbyircd Docker Image

on:
  push:
    branches:
      - unreal60_dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - unreal60_dev
  workflow_dispatch:

jobs:
  build:
    name: Build obbyircd Image
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image_name: obbyircd
      context: .
      dockerfile: ./docker/Dockerfile
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
