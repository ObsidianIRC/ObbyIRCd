name: e2e

on:
  push:
    branches: [unreal60_dev]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'docker/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: docker build -t obbyircd:e2e -f docker/Dockerfile .

      - run: pip install -e tests/e2e

      - run: pytest -v tests/e2e/
        env:
          OBBYIRCD_IMAGE: obbyircd:e2e
