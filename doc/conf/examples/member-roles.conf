/* Default member-roles configuration for ObbyIRCd.
 *
 * This file is included from the main config and replaces the legacy
 * built-in chanmodes/{chanowner,chanadmin,chanop,halfop,voice} +
 * chanmodes/topiclimit modules. Each role here registers a CMODE_MEMBER
 * with both a letter and a IRCv3 named-modes long name; the named name
 * is the role block name (owner/admin/op/halfop/voice).
 *
 * Channel registration:
 *   - Use /CREGISTER #foo (provided by member-roles) once you've
 *     identified to a services account. This sets +P, stamps the
 *     channel-registration ModData (persisted in channeldb), grants
 *     you the highest-rank role (owner) immediately, and adds an
 *     extban "+e ~automode:q:~account:<your-account>" so you re-acquire
 *     the role on every join.
 *
 * Granting roles to other accounts (no services daemon needed):
 *   /MODE #foo +e ~automode:o:~account:Alice    -- auto-op Alice on join
 *   /MODE #foo +e ~automode:h:~account:Bob      -- auto-halfop Bob
 *   /MODE #foo +I ~automode:v:~certfp:abcd...   -- auto-voice by certfp
 */

member-roles {
	/* Default permissions for users with no role. We deliberately
	 * leave can_set/can_unset unset (so the IRCd applies its built-in
	 * mode-permission logic) but set is_voice=no etc. so list-viewing
	 * and message-restriction bypass require an explicit role. */
	default {
		permissions {
			can_kick no;
			can_topic no;
			can_invite no;
			can_override_bans no;
			is_voice no;
			is_unkickable no;
			can_see_bans no;
			can_see_invex no;
			can_see_excepts no;
		}
	}

	/* +q ~ owner -- block-name is the IRCv3 named-modes long name */
	owner {
		prefix "~";
		rank 4000;
		mode "q";
		permissions {
			can_kick yes;
			can_topic yes;
			can_invite yes;
			can_override_bans yes;
			is_voice yes;
			is_unkickable yes;
			can_see_bans yes;
			can_see_invex yes;
			can_see_excepts yes;
			can_set "*";
			can_unset "*";
		}
	}

	/* +a & admin */
	admin {
		prefix "&";
		rank 3000;
		mode "a";
		permissions {
			can_kick yes;
			can_topic yes;
			can_invite yes;
			can_override_bans yes;
			is_voice yes;
			is_unkickable yes;
			can_see_bans yes;
			can_see_invex yes;
			can_see_excepts yes;
			can_set "*";
			can_unset "*";
		}
	}

	/* +o @ op */
	op {
		prefix "@";
		rank 2000;
		mode "o";
		permissions {
			can_kick yes;
			can_topic yes;
			can_invite yes;
			can_override_bans yes;
			is_voice yes;
			can_see_bans yes;
			can_see_invex yes;
			can_see_excepts yes;
			can_set "bIemnstkliMVKDNG";
			can_unset "bIemnstkliMVKDNG";
		}
	}

	/* +h % halfop -- mid-tier moderation */
	halfop {
		prefix "%";
		rank 1000;
		mode "h";
		permissions {
			can_kick yes;
			can_topic yes;
			can_invite yes;
			is_voice yes;
			can_see_bans yes;
			can_see_invex yes;
			can_see_excepts yes;
			can_set "bIev";
			can_unset "bIev";
		}
	}

	/* +v + voice -- speak through +m, no further power.
	 * Negative rank intentional: matches RANK_VOICE = -1 in
	 * include/modules.h, so member-roles is wire-compatible with
	 * legacy ircd assumptions about voice ordering. */
	voice {
		prefix "+";
		rank -1;
		mode "v";
		permissions {
			is_voice yes;
		}
	}
}
