/* Example PushBot configuration.
 *
 * Drop this into obbyircd.conf (or include it from there) once the
 * pushbot module is loaded.  After /REHASH:
 *
 *   * Each `bot {}` block below materialises a ghost user with that
 *     nick, joins the listed channels, and shows up in /NAMES.
 *   * The bot's bearer token (the value of `token`) is what the
 *     external bot service uses to authenticate on the gateway WS
 *     (phase 2) and the REST API (phase 4).
 *   * /PUSHBOT LIST + /PUSHBOT INFO <nick> are IRCop commands you can
 *     use to inspect state.
 *
 * Until later phases land, the ghost is marked away ("bot offline")
 * because nothing's actually connected to it yet.
 */

pushbot {
    /* Registration policy default.  admin = only via this config
     * file (after /REHASH).  approval = anyone with an account can
     * register via REST, but an IRCop must /PUSHBOT APPROVE before
     * they go live.  open = anyone with an account can register
     * and the bot is immediately active. */
    mode "admin";

    /* Where the SQLite store lives (relative paths resolve under
     * PERMDATADIR, same convention as memo.db / metadata.db). */
    database "pushbot.db";

    /* A simple statically-defined "weather" bot.  In phase 1 this
     * only makes the ghost appear in #weather and #general; the
     * actual bot logic happens out-of-process and won't connect
     * until the gateway / webhook subsystems land. */
    bot "weather" {
        token "replace-me-with-a-long-random-string";
        realname "Weather Bot";
        scope "channel";              /* channel | server */
        transport "gateway";          /* gateway | webhook | both */
        auto-join {
            "#weather";
            "#general";
        };
    };

    /* A network-wide help bot.  No channels listed: server-wide
     * bots aren't in any channel, they're addressable via /help
     * from anywhere on the network (once phase 5 lands). */
    bot "help" {
        token "replace-me-too";
        realname "Help Bot";
        scope "server";
        transport "gateway";
    };
};
