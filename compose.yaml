# Full ObsidianIRC stack -- obbyircd + hosted-backend SFU + ObsidianIRC web client.
# Designed for Coolify (Traefik) deployment with one subdomain per service:
#   ${WEB_FQDN}  -> ObsidianIRC web client (HTTPS)
#   ${API_FQDN}  -> hosted-backend HTTP API (HTTPS)
#   ${IRC_FQDN}  -> obbyircd WebSocket (WSS)
# TURN listens on UDP 3478 published directly on the host (Traefik does not
# proxy UDP).  Media is DTLS-SRTP encrypted by WebRTC, so TURN over UDP is
# already secure -- TURNS would only wrap the (irrelevant) TURN framing.

services:
  obbyircd:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: obbyircd:local
    container_name: obbyircd
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ${CONF_BIND:-obbyircd_conf}:/home/obbyircd/obby/conf
      - ${DATA_BIND:-obbyircd_data}:/home/obbyircd/obby/data
      - ${LOGS_BIND:-obbyircd_logs}:/home/obbyircd/obby/logs
      - ${TLS_BIND:-obbyircd_tls}:/home/obbyircd/obby/tls
      - ${CUSTOM_MODULES_BIND:-obbyircd_custom_modules}:/home/obbyircd/obby/custom-modules
      # Voice bridge socket dir, shared with hosted-backend.
      - ${VOICE_BRIDGE_BIND:-obbyircd_voice_bridge}:/run/obbyirc
    environment:
      WS_PORT: "8080"
      VOICE_BRIDGE_SOCKET: ${VOICE_BRIDGE_SOCKET:-/run/obbyirc/voice.sock}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.obbyircd.rule=Host(`${IRC_FQDN}`)
      - traefik.http.routers.obbyircd.tls=true
      - traefik.http.services.obbyircd.loadbalancer.server.port=8080

  hosted-backend:
    build:
      context: https://github.com/ObsidianIRC/hosted-backend.git#feat/voice-channels
      dockerfile: Dockerfile
    image: hosted-backend:local
    container_name: hosted-backend
    restart: unless-stopped
    depends_on:
      - obbyircd
    expose:
      - "8080"
    ports:
      # TURN UDP must be published directly -- Traefik does not handle UDP.
      - "${TURN_PORT:-3478}:3478/udp"
    volumes:
      - backend_data:/app/data
      - backend_images:/app/images
      - ${VOICE_BRIDGE_BIND:-obbyircd_voice_bridge}:/run/obbyirc
    environment:
      PORT: "8080"
      VOICE_BRIDGE_SOCKET: ${VOICE_BRIDGE_SOCKET:-/run/obbyirc/voice.sock}
      VOICE_TURN_SECRET: ${VOICE_TURN_SECRET:?set VOICE_TURN_SECRET in Coolify}
      VOICE_PUBLIC_IP: ${VOICE_PUBLIC_IP:?set VOICE_PUBLIC_IP in Coolify}
      VOICE_TURN_PORT: "3478"
      VOICE_MAX_ROOM: "25"
    env_file:
      - path: .env
        required: false
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${API_FQDN}`)
      - traefik.http.routers.backend.tls=true
      - traefik.http.services.backend.loadbalancer.server.port=8080

  obsidian:
    build:
      context: ./ObsidianIRC
      dockerfile: ./Dockerfile
      args:
        VITE_DEFAULT_IRC_SERVER: wss://${IRC_FQDN}
        VITE_DEFAULT_IRC_SERVER_NAME: ${NETWORK_NAME:-ObbyNetwork}
    image: obsidianirc:local
    container_name: obsidianirc
    restart: unless-stopped
    depends_on:
      - hosted-backend
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.obsidian.rule=Host(`${WEB_FQDN}`)
      - traefik.http.routers.obsidian.tls=true
      - traefik.http.services.obsidian.loadbalancer.server.port=80

volumes:
  obbyircd_conf:
    driver: local
  obbyircd_data:
    driver: local
  obbyircd_logs:
    driver: local
  obbyircd_tls:
    driver: local
  obbyircd_custom_modules:
    driver: local
  obbyircd_voice_bridge:
    driver: local
  backend_data:
    driver: local
  backend_images:
    driver: local
